# Spatio-Temporal Blending Experiment Configuration
experiment_name: "spatiotemporal_blending"
description: "Evaluates Spatio-Temporal CNN + GRU gating across sequential forecast cycles [t-3, t-2, t-1, t]"
seed: 42
data_mode: "synthetic"

spatiotemporal:
  sequence_length: 4
  hidden_dim: 32
  recurrent_type: "gru"
  epochs: 40
  batch_size: 8
  learning_rate: 0.001
  dropout: 0.10

benchmarks:
  - "spatial_cnn"
  - "regime_blender"
  - "spatial_inverse_variance"
  - "equal_weight"
